    <path d="M27 21l22 22-5.6 5.6L21.4 26.6 27 21z" opacity="0.15" fill="#000000" />
    <path d="M43 43l-22-22c-1.2-1.2-3.1-1.2-4.2 0l-1.4 1.4c-1.2 1.2-1.2 3.1 0 4.2l22 22c1.2 1.2 3.1 1.2 4.2 0l1.4-1.4c1.2-1.2 1.2-3.1 0-4.2z" fill="#ffffff" />
